name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Best-effort fresh pull from the AP-TRANSCO GIS so a code deploy never ships an older network
      # (or an old "synced" timestamp) than the last scheduled sync. Falls back to committed data.
      - run: npm run sync:live || echo "::warning::live sync unavailable — deploying committed network data"

      # Regenerate the static data from data/raw (live pulls + snapshots) — keeps deploy reproducible.
      - run: npm run build:data

      - run: npm test

      # BASE_PATH must match the repo name for a project site (username.github.io/<repo>/).
      # Override here if the repository is renamed.
      - run: npm run build
        env:
          BASE_PATH: /ap-gis-grid/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerate the static data from data/raw (live pulls + snapshots) — keeps deploy reproducible.
      - run: npm run build:data

      # Static vector tiles for the heavy overlays (public/tiles — never committed). tippecanoe comes
      # from Ubuntu's apt; --require fails the deploy rather than silently shipping GeoJSON-only.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tippecanoe
      - run: npm run build:tiles -- --require

      - run: npm test

      # BASE_PATH must match the repo name for a project site (username.github.io/<repo>/).
      # Override here if the repository is renamed.
      - run: npm run build
        env:
          BASE_PATH: /ap-gis-grid/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Playwright smoke suite against the production build. Non-blocking while the Atlas 2.0 revamp
  # settles — it reports, but never holds back a deploy.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Same tiles as the deploy, so the smoke suite exercises the tiled path.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends tippecanoe
      - run: npm run build:tiles -- --require

      - run: npm run build
        env:
          BASE_PATH: /ap-gis-grid/

      - run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages' "syncing_files" step for this ~10k-file site has taken 10 s to 9.5 min; the default 10 min
          # timeout cancelled three deploys on 2026-11-07. 30 min leaves room without hiding a real hang.
          timeout: 1800000

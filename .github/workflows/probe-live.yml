name: Probe live GIS reachability (temporary)
on:
  push:
    branches: [feat/live-sync]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in 1.1.1.1 9.9.9.9 8.8.8.8 208.67.222.222; do echo "@$r -> $(dig +short +time=5 @$r gis.aptransco.gov.in | tr '\n' ' ')"; done
          curl -sS -m 40 -o /dev/null -w "pinned IP: HTTP %{http_code} in %{time_total}s\n" --resolve gis.aptransco.gov.in:443:103.129.74.59 "https://gis.aptransco.gov.in/server/rest/services?f=json" || true
          curl -sS -m 40 -o /dev/null -w "http pinned: %{http_code}\n" "http://103.129.74.59/" || true

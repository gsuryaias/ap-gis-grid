name: Live network sync

# Pulls the AP-TRANSCO grid + DISCOM 33 kV layers from the AP-TRANSCO enterprise GIS
# (gis.aptransco.gov.in ArcGIS REST — the same server the Google-Earth KMZ NetworkLinks use),
# rebuilds the static data, and redeploys Pages.
#
#  - Network CHANGED  → commit data/raw/live + public/data to main (git history = audit trail),
#                       then deploy.
#  - Network unchanged → no commit; still redeploy so the in-app "Live · synced N ago" badge is
#                        truthful (live-status.json carries the run time).
#  - Source unreachable / every layer rejected → no deploy; a `live-sync-failure` issue is opened.
#    The app keeps serving the last good data and its badge turns amber ("Stale") after ~13 h.
#
# Every 6 h at :15 UTC (05:45 / 11:45 / 17:45 / 23:45 IST).
on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull live layers from the AP-TRANSCO GIS
        run: npm run sync:live
        env:
          # Optional — only needed for token-protected folders (e.g. APCPDCL). Set as repo secrets.
          AP_GIS_TOKEN: ${{ secrets.AP_GIS_TOKEN }}
          AP_GIS_USERNAME: ${{ secrets.AP_GIS_USERNAME }}
          AP_GIS_PASSWORD: ${{ secrets.AP_GIS_PASSWORD }}

      - name: Detect network changes
        id: diff
        run: |
          # manifest.json changes every run (timestamps) — only real layer/changelog edits count.
          if [ -n "$(git status --porcelain -- data/raw/live ':!data/raw/live/manifest.json')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build:data

      # ETL + app unit tests and emitted-data integrity checks (the MIS pipeline tests hit
      # third-party sites and are covered by their own workflow).
      - run: npx vitest run scripts src

      - name: Commit network changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          summary=$(node -e '
            const log = require("./data/raw/live/changelog.json");
            const m = require("./data/raw/live/manifest.json");
            const e = log[0] && log[0].at === m.lastRun ? log[0] : null;
            console.log(e ? e.layers.map(l => `${l.name} +${l.added}/-${l.removed}/~${l.modified}`).join(", ") : "layer refresh");
          ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/live public/data
          git commit -m "data(live): network sync — ${summary}"
          git push origin HEAD:main

      - run: npm run build
        env:
          BASE_PATH: /ap-gis-grid/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Report sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Live network sync failing"
          body="The scheduled sync from gis.aptransco.gov.in failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The site keeps serving the last good data."
          n=$(gh issue list --label live-sync-failure --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else
            gh label create live-sync-failure --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "$title" --body "$body" --label live-sync-failure; fi

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
